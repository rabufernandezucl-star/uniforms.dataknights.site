<div class="section">
<h2>Cap – Green</h2>

<table border="1" width="100%">
<tr>
<th>Item</th>
<th>Stock</th>
<th>Status</th>
<th class="claim-col">Action</th>
<th class="admin-control">Admin</th>
</tr>

<tr>
<td>Cap – Green</td>

<!-- STOCK DISPLAY -->
<td id="cap-green-stock">50</td>

<!-- STATUS DISPLAY -->
<td id="cap-green-status" class="available">
Available
</td>

<!-- CLAIM BUTTON (USER VIEW) -->
<td class="claim-col">
<button onclick="claimCap('cap-green',this)">
Claim
</button>
</td>

<!-- ADMIN CONTROLS -->
<td class="admin-control">

<!-- EDIT STOCK -->
<input type="number"
       id="cap-green-stock-edit"
       value="50"
       min="0">

<br><br>

<!-- EDIT STATUS -->
<select id="cap-green-status-edit">
<option value="Available">Available</option>
<option value="Not Available">Not Available</option>
</select>

<br><br>

<!-- UPDATE BUTTON -->
<button onclick="updateCap('cap-green')">
Update
</button>

</td>
</tr>

</table>
</div>
